name: run tests and push image to registry
on: [push, workflow_dispatch]

env:
    IMAGE_BASE_NAME: ${{ github.repository }}
    VERSION: ${{ github.sha }}
    REGISTRY: "ghcr.io"

permissions:
    contents: read
    packages: write

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      business: ${{ steps.filter.outputs.business }}
      review: ${{ steps.filter.outputs.review }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Detect changes
      uses: dorny/paths-filter@v3
      id: filter
      with:
       filters: |
        business:
        - 'business/**'
        - 'pkg/**'
        - 'go.mod'
        - 'go.sum'
        - 'business-service.Dockerfile'
        review:
        - 'review/**'
        - 'pkg/**'
        - 'go.mod'
        - 'go.sum'
        - 'review-service.Dockerfile'
  
  build-business-service:
    needs: [detect-changes]
    if: needs.detect-changes.outputs.business == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: login to container registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: push to github registry
        id: build-and-push
        uses: docker/build-push-action@v7
        with:
          context: .
          sbom: true
          provenance: mode=max
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_BASE_NAME }}/business-service:${{ env.VERSION }} 
      - name: Add summary
        run: |
          echo "## ✅ Business Service Built and Pushed" >> $GITHUB_STEP_SUMMARY
          echo "**Image:** ${{ env.REGISTRY }}/${{ env.IMAGE_BASE_NAME }}/business-service:${{ env.VERSION }}" >> $GITHUB_STEP_SUMMARY
  
          
  build-review-service:
    needs: [detect-changes]
    runs-on: ubuntu-latest
    if: needs.detect-changes.outputs.review == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: login to container registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: push to github registry
        id: build-and-push
        uses: docker/build-push-action@v7
        with:
          context: .
          sbom: true
          provenance: mode=max
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_BASE_NAME }}/review-service:${{ env.VERSION }} 
      - name: Add summary
        run: |
          echo "## ✅ Review Service Built and Pushed" >> $GITHUB_STEP_SUMMARY
          echo "**Image:** ${{ env.REGISTRY }}/${{ env.IMAGE_BASE_NAME }}/review-service:${{ env.VERSION }}" >> $GITHUB_STEP_SUMMARY
